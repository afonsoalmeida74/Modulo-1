<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos | Nexa Digital</title>
</head>
<body>
    <header>
        <h1>Nexa Digital</h1>
        <p>Soluções digitais simples para empresas que querem crescer.</p>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index5.html">Início</a></li>
                <li><a href="about.html">Sobre nós</a></li>
                <li><a href="services.html">Serviços</a></li>
                <li><a href="contact.html" aria-current="page">Contactos</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Fale connosco</h2>
        <p>Preencha o formulário e entraremos em contacto consigo.</p>
        <form action="#" method="post">
            <p>
                <label for="nome">Nome</label><br>
                <input type="text" id="nome" name="nome" autocomplete="name" minlength="2" maxlength="100" required>
            </p>
            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </p>
            <p>
                <label for="empresa">Empresa</label><br>
                <input type="text" id="empresa" name="empresa" autocomplete="organization" maxlength="100">
            </p>
            <p>
                <label for="servico">Serviço pretendido</label><br>
                <select id="servico" name="servico" required>
                    <option value="" selected disabled>Escolha uma opção</option>
                    <option value="website">Website institucional</option>
                    <option value="loja">Loja online</option>
                    <option value="consultoria">Consultoria digital</option>
                </select>
            </p>
            <p>
                <label for="mensagem">Mensagem</label><br>
                <textarea id="mensagem" name="mensagem" rows="7" cols="50" minlength="10" maxlength="2000" required></textarea>
            </p>
            <p>
                <input type="checkbox" id="consentimento" name="consentimento" required>
                <label for="consentimento">Aceito ser contactado pela Nexa Digital.</label>
            </p>
            <button type="submit">Enviar pedido</button>
        </form>
    </main>
    <footer><p>&copy; 2026 Nexa Digital</p></footer>
</body>
</html>
